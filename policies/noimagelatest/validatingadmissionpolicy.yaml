apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "noimagelatest"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
    - expression: "object.metadata.namespace == 'default' && object.spec.containers.image.endsWith('latest')"
      messageExpression: "'Deployment spec.replicas set to ' + string(object.spec.replicas)"
