apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: dev

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: full-access
rules:
  - apiGroups: ["*"] # "" indicates the core API group
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: limited-access
rules:
  - apiGroups: ["*"] # "" indicates the core API group
    resources: ["*"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: full-access
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: dev
    apiGroup: ""
roleRef:
  kind: ClusterRole #this must be Role or ClusterRole
  name: full-access # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: staging-access
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: dev
    apiGroup: ""
roleRef:
  kind: ClusterRole #this must be Role or ClusterRole
  name: limited-access # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-access
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: dev
    apiGroup: ""
roleRef:
  kind: ClusterRole #this must be Role or ClusterRole
  name: limited-access # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: ""
