apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    role: "database"
spec:
  selector:
    matchLabels:
      role: "database"
  replicas: 1
  template:
    metadata:
      labels:
        role: "database"
    spec:
      containers:
      - name: database-container
        image: stefanprodan/podinfo:latest
        env:
        - name: PODINFO_UI_MESSAGE
          value: "Database Service"